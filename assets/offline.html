<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6150ff">
    <title>Offline — Nogin.nl</title>
    <link rel="manifest" href="/assets/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Nogin.nl">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/css/index.css?v=6">
    <script src="/assets/js/offline.js?v=3" defer></script>
</head>
<body>
<div class="ios-status-strip" aria-hidden="true"></div>
<main>
    <h1><img src="/assets/apple-touch-icon.png" alt="" width="32" height="32"> Nogin.nl?</h1>
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th scope="col">Naam</th>
                <th scope="col" class="status-cell">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr class="connection-warning">
                <td colspan="2">
                    <div class="connection-notice">
                        <span class="connection-icon" aria-hidden="true">!</span>
                        <span id="retry-status" role="status" aria-live="polite">You are offline. Retrying automatically…</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
